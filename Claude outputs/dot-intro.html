let colorMode='black',t0=performance.now();
const LIGHT=['#C9F28A','#7ADB8C','#F24E6B','#EE6882','#6A94C8','#4A7CC0'];
const WHITE=['#ffffff','#e9e9e9','#cfcfcf'];
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967295;}
const panels=[...document.querySelectorAll('canvas')].map(cv=>({cv,ctx:cv.getContext('2d'),m:cv.dataset.m}));
function size(){panels.forEach(p=>{const r=p.cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);p.cv.width=r.width*d;p.cv.height=r.height*d;});}
addEventListener('resize',size);
function delayOf(m,x,y,cols,rows){ // 0~1: 이 칸이 켜지기 시작하는 시점
  const r=hash(x,y);
  if(m==='random')return r*.85;
  if(m==='twinkle')return r*.78;
  if(m==='center'){const dx=(x+.5)/cols-.5,dy=((y+.5)/rows-.5)*rows/cols;return Math.min(1,Math.hypot(dx,dy)/.62)*.75+r*.18;}
  return (y/rows)*.72+r*.2; // top
}
function draw(now){
  const T=((now-t0)/1000)%3.5,D=1.9; // 1.9초 동안 등장, 나머지는 완성된 화면
  const pal=colorMode==='black'?null:colorMode==='white'?WHITE:LIGHT; // 검정: 도트 색 없이 칸이 검정에서 바로 화면으로 밝아짐
  panels.forEach(p=>{
    const {cv,ctx,m}=p,W=cv.width,H=cv.height,C=60*Math.min(W/1920,H/1080),cols=Math.ceil(W/C),rows=Math.ceil(H/C);
    // 칸 사이가 벌어져 보이지 않게: 화면을 한 번에 통째로 그리고, 그 위에 '아직 덜 드러난 칸'만 검정으로 덮음.
    // 칸 경계는 정수 픽셀로 맞춰(다음 칸 시작 = 이 칸 끝) 틈 없이 딱 붙게 함
    if(!img.complete){ctx.fillStyle='#080809';ctx.fillRect(0,0,W,H);return;}
    ctx.globalAlpha=1;ctx.drawImage(img,0,0,W,H);
    for(let y=0;y<rows;y++){
      const Y=Math.round(y*C),Y2=Math.round((y+1)*C);
      for(let x=0;x<cols;x++){
        const d=delayOf(m,x,y,cols,rows),span=m==='twinkle'?.3:.16;
        let t=Math.max(0,Math.min(1,(T/D-d)/span));
        if(m==='twinkle'&&t>0&&t<1){ // 깜빡임: 켜졌다 꺼졌다를 두세 번 반복하며 점점 밝게 자리 잡음
          const ph=hash(y+7,x+3),n=2+Math.floor(ph*2),on=Math.floor(t*(n*2+1)+ph)%2===0;
          t=on?Math.min(1,.55+t*.6):t*.12;
        }
        if(t>=1)continue;
        const X=Math.round(x*C),X2=Math.round((x+1)*C);
        if(pal&&t>0){ctx.globalAlpha=1-t;ctx.fillStyle=pal[Math.floor(hash(y,x)*pal.length)];ctx.fillRect(X,Y,X2-X,Y2-Y);continue;}
        ctx.globalAlpha=1-t;ctx.fillStyle='#080809';ctx.fillRect(X,Y,X2-X,Y2-Y);
      }
    }
    ctx.globalAlpha=1;
  });
  requestAnimationFrame(draw);
}
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{colorMode=b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));t0=performance.now();});
document.getElementById('replay').onclick=()=>{t0=performance.now();};
size();requestAnimationFrame(draw);
